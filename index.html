<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --lavender: #c9a0dc;
      --lavender-light: #e8d5f2;
      --lavender-deep: #8b6b9e;
      --mint: #a8e6cf;
      --emerald: #2ecc71;
      --forest: #1a3c34;
      --deep-green: #0d1f1a;
      --soft-green: #d4f5e9;
      --text: #f0eaf5;
      --muted: #b8a9c4;
      --card: rgba(26, 60, 52, 0.75);
      --glass: rgba(201, 160, 220, 0.08);
      --border: rgba(201, 160, 220, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--deep-green) 0%, #1a0f24 45%, var(--forest) 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201, 160, 220, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201, 160, 220, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(13, 31, 26, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
    }

    nav .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--lavender-light), var(--mint));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 1.75rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--lavender);
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald), #27ae60);
      color: #0d1f1a;
      box-shadow: 0 4px 24px rgba(46, 204, 113, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(46, 204, 113, 0.45);
    }

    .btn-outline {
      background: transparent;
      color: var(--lavender-light);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--lavender);
      color: var(--lavender);
    }

    .hero {
      padding: 5rem 0 4rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--mint);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5.5vw, 3.6rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      background: linear-gradient(120deg, var(--lavender-light) 20%, var(--mint) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero .tagline {
      font-size: 1.2rem;
      color: var(--muted);
      max-width: 580px;
      margin: 0 auto 2.5rem;
    }
